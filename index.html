function dayMaster(y,m,d){
  const base=new Date(1900,0,1), t=new Date(y,m-1,d);
  const diff=Math.round((t-base)/86400000);
  const idx=((10+diff)%60+60)%60;
  return STEMS[idx%10];

// ===== 流程 =====
let scores={}, curQ=0, userInfo={};
document.getElementById('btnStart').addEventListener('click', function(){
  const name=document.getElementById('inName').value.trim();
  const gender=document.getElementById('inGender').value;
  const birth=document.getElementById('inBirth').value;
  if(!birth){ alert('请选择出生日期'); return; }
  const [y,m,d]=birth.split('-').map(Number);
  userInfo={name:name||'你', gender, dm:dayMaster(y,m,d)};
  userInfo.el=STEM_EL[userInfo.dm];
  scores={}; Object.keys(DIMS).forEach(k=>scores[k]=0);
  document.getElementById('stepInfo').classList.add('hidden');
  document.getElementById('stepQuiz').classList.remove('hidden');
  curQ=0; renderQ();
});
function renderQ(){
  const item=QUESTIONS[curQ];
  document.getElementById('progBar').style.width=(curQ/QUESTIONS.length*100)+'%';
  document.getElementById('qNum').textContent='第 '+(curQ+1)+' / '+QUESTIONS.length+' 题';
  document.getElementById('qText').textContent=item.q;
  const box=document.getElementById('qOpts'); box.innerHTML='';
  item.opts.forEach(function(o){
    const b=document.createElement('button'); b.className='opt'; b.textContent=o.t;
    b.addEventListener('click', function(){
      Object.keys(o.s).forEach(k=>scores[k]+=o.s[k]);
      curQ++;
      if(curQ<QUESTIONS.length) renderQ(); else showLoading();
    });
    box.appendChild(b);
  });
}
const LOAD_MSGS=['正在排盘推演…','正在参详你的日主…','正在翻阅千年人物谱…','正在为你匹配命格…'];
function showLoading(){
  document.getElementById('stepQuiz').classList.add('hidden');
  document.getElementById('stepLoading').classList.remove('hidden');
  let i=0;
  const timer=setInterval(function(){
    i=(i+1)%LOAD_MSGS.length;
    document.getElementById('loadText').textContent=LOAD_MSGS[i];
  },700);
  setTimeout(function(){ clearInterval(timer); showResult(); },2400);
}
function showResult(){
  document.getElementById('stepLoading').classList.add('hidden');
  document.getElementById('stepResult').classList.remove('hidden');
  // 匹配：维度向量余弦相似 + 日主五行微调
  let best=null, bestScore=-1;
  FIGURES.forEach(function(f){
    let dot=0,na=0,nb=0;
    Object.keys(DIMS).forEach(k=>{ dot+=scores[k]*f.p[k]; na+=scores[k]*scores[k]; nb+=f.p[k]*f.p[k]; });
    let sim=dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
    if(f.gender===userInfo.gender) sim*=1.15; // 同性别加成
    if(sim>bestScore){ bestScore=sim; best=f; }
  });
  const matchPct=Math.round(82+bestScore*16); // 展示用契合度
  document.getElementById('rIntro').textContent=userInfo.name+'，与你命格最契合的历史人物是（契合度 '+matchPct+'%）';
  document.getElementById('rAvatar').textContent=best.avatar;
  document.getElementById('rName').textContent=best.name;
  document.getElementById('rTag').textContent=best.tag;
  document.getElementById('rBazi').innerHTML='你的日主为 <b>'+userInfo.dm+userInfo.el+'</b>。'+baziLine(userInfo.dm);
  document.getElementById('rDesc').textContent=best.desc;
  document.getElementById('rVerdict').textContent=best.verdict;
  // 维度条
  const maxV=Math.max.apply(null,Object.values(scores));
  const bars=document.getElementById('rBars'); bars.innerHTML='';
  Object.keys(DIMS).forEach(function(k){
    const pct=Math.round(scores[k]/(maxV||1)*100);
    bars.innerHTML+='<div class="bar-row"><span>'+DIMS[k]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-val">'+scores[k]+'</div></div>';
  });
  document.getElementById('rShare').innerHTML='📸 截图分享你的结果<br>想知道朋友像谁？把链接发给 TA 一起测';
}
function baziLine(dm){
  const map={
    '甲':'甲木如参天大树，正直向上、有担当，天生有股不服输的劲。',
    '乙':'乙木如藤蔓花草，柔韧灵活、亲和力强，以柔克刚是你的本事。',
    '丙':'丙火如太阳，热情外放、感染力强，走到哪都是人群的焦点。',
    '丁':'丁火如灯烛，温暖细腻、洞察人心，外表安静内心有光。',
    '戊':'戊土如高山，稳重可靠、有包容力，是别人眼里的定海神针。',
    '己':'己土如田园，踏实包容、善于经营，默默把日子过成想要的样子。',
    '庚':'庚金如刀剑，果断刚毅、执行力强，认准的事绝不拖泥带水。',
    '辛':'辛金如珠宝，精致敏锐、追求完美，对品质有自己的坚持。',
    '壬':'壬水如江河，智慧流动、适应力强，脑子转得比谁都快。',
    '癸':'癸水如雨露，聪慧内敛、直觉敏锐，看似安静实则深不可测。'
  };
  return map[dm]||'';
}
